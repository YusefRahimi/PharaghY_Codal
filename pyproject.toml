[project]
name = "PharaghY-codal"
version = "0.3.1"
description = "Python library to extract raw financial data from Codal (codal.ir) for fundamental analysis of Iranian listed companies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PharaghY" }]
requires-python = ">=3.10"
keywords = [
    "codal",
    "codal-ir",
    "tehran-stock-exchange",
    "tse",
    "bourse",
    "iran",
    "financial-statements",
    "fundamental-analysis",
    "disclosures",
    "monthly-activity",
    "capital-increase",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "lxml>=4.9",
]

[project.optional-dependencies]
curl = ["curl-cffi>=0.6", "httpx-curl-cffi>=0.1.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/PharaghY/PharaghY_Codal"
Issues = "https://github.com/PharaghY/PharaghY_Codal/issues"
Changelog = "https://github.com/PharaghY/PharaghY_Codal/blob/main/CHANGELOG.md"
Telegram = "https://t.me/bourse_faraghy"
Telegram = "https://t.me/bourse_faraghy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharaghy_codal"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real codal.ir"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
